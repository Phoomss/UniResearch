###############################################################################
# UniResearch – Full-Stack Docker Compose
# Usage:
#   Development:  docker compose up --build
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
###############################################################################

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: uniresearch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-uniresearch}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uniresearch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uniresearch_net

  # ─── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: uniresearch_backend
    restart: unless-stopped
    command: >
      sh -c "
        python -m app.scripts.bootstrap_db && alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/static
      - /app/__pycache__
      - /app/.pytest_cache
    environment: &backend_environment
      - RESEARCH_FLOW_ENABLED=${RESEARCH_FLOW_ENABLED:-true}
      - RESEARCH_FLOW_PROVIDER=${RESEARCH_FLOW_PROVIDER:-gemini}
      - RESEARCH_FLOW_AGENT_MODELS
      - RESEARCH_FLOW_DEPTH_SOURCES
      - RESEARCH_FLOW_PAPER_BATCH_SIZE=${RESEARCH_FLOW_PAPER_BATCH_SIZE:-3}
      - RESEARCH_FLOW_AGENT_TIMEOUT=${RESEARCH_FLOW_AGENT_TIMEOUT:-90}
      - RESEARCH_FLOW_OUTPUT_TOKENS=${RESEARCH_FLOW_OUTPUT_TOKENS:-4096}
      - RESEARCH_FLOW_MAX_CONTEXT_CHARS=${RESEARCH_FLOW_MAX_CONTEXT_CHARS:-40000}
      - RESEARCH_FLOW_MAX_ACTIVE_PER_USER=${RESEARCH_FLOW_MAX_ACTIVE_PER_USER:-2}
      - RESEARCH_FLOW_MAX_ACTIVE_GLOBAL=${RESEARCH_FLOW_MAX_ACTIVE_GLOBAL:-20}
      - RESEARCH_FLOW_CREATIONS_PER_HOUR=${RESEARCH_FLOW_CREATIONS_PER_HOUR:-10}
      - RESEARCH_FLOW_POLL_SECONDS=${RESEARCH_FLOW_POLL_SECONDS:-2}
      - RESEARCH_FLOW_MAX_RESEARCH_ITERATIONS=${RESEARCH_FLOW_MAX_RESEARCH_ITERATIONS:-3}
      - RESEARCH_FLOW_MAX_AGENT_RETRIES=${RESEARCH_FLOW_MAX_AGENT_RETRIES:-2}
      - RESEARCH_FLOW_MAX_SEARCH_ROUNDS=${RESEARCH_FLOW_MAX_SEARCH_ROUNDS:-3}
      - RESEARCH_FLOW_MAX_PAPERS=${RESEARCH_FLOW_MAX_PAPERS:-20}
      - RESEARCH_FLOW_MAX_WORKFLOW_DURATION=${RESEARCH_FLOW_MAX_WORKFLOW_DURATION:-900}
      - RESEARCH_FLOW_MAX_LLM_CALLS=${RESEARCH_FLOW_MAX_LLM_CALLS:-40}
      - RESEARCH_FLOW_MAX_TOKENS=${RESEARCH_FLOW_MAX_TOKENS:-100000}
      - PROJECT_NAME=${PROJECT_NAME:-UniResearch}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-uniresearch}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey-change-this-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - APP_ENV=${APP_ENV:-development}
      - DB_SSL=${DB_SSL:-false}
      - DEV_ADMIN_EMAIL=${DEV_ADMIN_EMAIL:-}
      - DEV_ADMIN_PASSWORD=${DEV_ADMIN_PASSWORD:-}
      - MAX_COVER_IMAGE_BYTES=${MAX_COVER_IMAGE_BYTES:-5242880}
      - MAX_DOCUMENT_BYTES=${MAX_DOCUMENT_BYTES:-26214400}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-2048}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
      - AI_ENABLED=${AI_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uniresearch_net

  # Durable ResearchFlow worker, reusing the backend code/image and database.
  research-flow-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: python -m app.services.research_flow.worker
    volumes:
      - ./backend:/app
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - uniresearch_net

  # ─── Next.js Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: uniresearch_frontend
    restart: unless-stopped
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - uniresearch_net

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backend_static:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  uniresearch_net:
    driver: bridge
