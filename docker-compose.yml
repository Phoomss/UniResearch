###############################################################################
# UniResearch – Full-Stack Docker Compose
# Usage:
#   Development:  docker compose up --build
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
###############################################################################

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: uniresearch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-uniresearch}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uniresearch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uniresearch_net

  # ─── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: uniresearch_backend
    restart: unless-stopped
    command: >
      sh -c "
        alembic upgrade head 2>/dev/null || echo 'Alembic migration skipped (no migrations found)' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/static
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-UniResearch}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-uniresearch}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey-change-this-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - APP_ENV=${APP_ENV:-development}
      - DEV_ADMIN_EMAIL=${DEV_ADMIN_EMAIL:-}
      - DEV_ADMIN_PASSWORD=${DEV_ADMIN_PASSWORD:-}
      - MAX_COVER_IMAGE_BYTES=${MAX_COVER_IMAGE_BYTES:-5242880}
      - MAX_DOCUMENT_BYTES=${MAX_DOCUMENT_BYTES:-26214400}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uniresearch_net

  # ─── Next.js Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: uniresearch_frontend
    restart: unless-stopped
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - uniresearch_net

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backend_static:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  uniresearch_net:
    driver: bridge
