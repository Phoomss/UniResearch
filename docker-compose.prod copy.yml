###############################################################################
# UniResearch – Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
###############################################################################

services:
  backend:
    build:
      target: production
    restart: always
    command: >
      sh -c "
        alembic upgrade head 2>/dev/null || echo 'Alembic migration skipped' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    volumes:
      - backend_static:/app/static
    environment:
      - APP_ENV=production

  frontend:
    build:
      target: production
    restart: always
    command: ["node", "server.js"]
    volumes: []
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:8000

  db:
    restart: always
