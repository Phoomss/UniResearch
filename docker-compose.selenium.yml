services:
  selenium-tests:
    # Chrome for Testing provides Linux ChromeDriver for x86_64.
    # Docker Desktop emulates this platform on Apple Silicon.
    platform: linux/amd64
    build:
      context: .
      dockerfile: tests/selenium/Dockerfile
    init: true
    shm_size: "2gb"
    volumes:
      - ./tests/selenium/artifacts:/artifacts
    environment:
      UNIRESEARCH_TEST_COMMIT: ${UNIRESEARCH_TEST_COMMIT:-unknown}
    command: ["-m", "narongsak", "-v"]
