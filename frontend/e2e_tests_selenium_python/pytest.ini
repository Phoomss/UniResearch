[pytest]
addopts = -v --tb=short --html=report.html --self-contained-html
markers =
    tc_001: Student valid login
    tc_002: Session persistence & verification
    tc_003: View student profile
    tc_004: Edit name and department
    tc_005: Change password and relogin
    tc_006: Discovery stats grid on homepage
    tc_007: Latest research display
    tc_008: Featured and popular research
    tc_009: Block unauthenticated visitor from submission form
    tc_010: Block unauthenticated API submission
    tc_011: Block guest role from submission
    tc_012: Upload normal PDF document
    tc_013: Upload boundary max 25MB PDF document
    tc_014: Reject boundary over 26MB PDF document
    tc_015: Upload normal cover image
    tc_016: Upload boundary max 5MB cover image
    tc_017: Reject boundary over 6MB cover image
    tc_018: Reject invalid document extension (.txt)
    tc_019: Reject invalid cover image extension (.txt)
    tc_020: Reject fake PDF with invalid signature
    tc_021: Verify rollback and no orphan cover image when document fails
    tc_022: Unauthenticated download button hidden and prompt shown
    tc_023: Unauthenticated download API rejected and counter unchanged
    tc_024: Authenticated download nonexistent file returns 404
    tc_025: Add favorite and verify in saved page
    tc_026: Remove favorite and verify removed from saved page
