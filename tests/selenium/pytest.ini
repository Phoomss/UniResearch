[pytest]
testpaths = .
addopts = -ra --strict-markers --tb=short
markers =
    narongsak: the 18 cases assigned to Narongsak
    ui: requires a Selenium browser and the frontend
    auth: Narongsak auth cases
    category: Narongsak category cases
    user: Narongsak user cases
    recommendation: Narongsak recommendation cases
    submission: Narongsak submission cases
    review: Narongsak review cases
    notification: Narongsak notification cases
    ai: Narongsak ai cases
    e2e: Narongsak e2e cases
