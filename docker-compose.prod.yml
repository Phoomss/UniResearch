services:
  backend:
    build:
      target: production
    restart: always

    command: >
      sh -c "
        python -m app.scripts.bootstrap_db && alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

    volumes: !override
      - backend_static:/app/static

    environment:
      - APP_ENV=production

  frontend:
    build:
      target: production
    restart: always

    command: ["node", "server.js"]

    volumes: !reset []

    ports: !override
      - "80:3000"

    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:8000

  db:
    restart: always
  research-flow-worker:
    build:
      target: production
    volumes: !reset []
    environment:
      - APP_ENV=production
