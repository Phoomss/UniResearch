apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:

    metadata:
      labels:
        app: grafana

    spec:

      containers:

        - name: grafana

          image: grafana/grafana:12.1.1

          ports:

            - containerPort: 3000

          env:

            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123

          resources:

            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:

            - name: storage
              mountPath: /var/lib/grafana

      volumes:

        - name: storage

          persistentVolumeClaim:
            claimName: grafana-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring

spec:
  type: NodePort

  selector:
    app: grafana

  ports:

    - name: http

      port: 3000

      targetPort: 3000

      nodePort: 30300
