apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: uniresearch
  labels:
    app: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: phoom005/uniresearch-backend:latest
          imagePullPolicy: Always

          command:
            - sh
            - -c
            - |
              alembic upgrade head || echo "Alembic migration skipped"
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

          ports:
            - containerPort: 8000

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT

            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DATABASE_HOST

            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DATABASE_PORT

            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database

            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DATABASE_URL

            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_SSL

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"

          volumeMounts:
            - name: backend-static
              mountPath: /app/static

      volumes:
        - name: backend-static
          persistentVolumeClaim:
            claimName: backend-static-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: uniresearch

spec:
  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: uniresearch

data:
  PORT: "8000"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DB_SSL: "false"

  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-service:5432/uniresearch?ssl=disable"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-static-pvc
  namespace: uniresearch

spec:
  storageClassName: manual-backend
  accessModes:
    - ReadWriteOnce

  volumeMode: Filesystem

  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-static-pv

spec:
  storageClassName: manual-backend

  capacity:
    storage: 5Gi

  accessModes:
    - ReadWriteOnce

  volumeMode: Filesystem

  persistentVolumeReclaimPolicy: Retain

  hostPath:
    path: /data/backend-static
    type: DirectoryOrCreate